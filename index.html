<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>여행 노트</title>
<style>
  :root{
    --ink:#0b1b2b; --sea:#0a6ea8; --sea2:#11a3c9; --sand:#f6efe4; --sun:#ff8a3d;
    --card:#ffffff; --muted:#5b6b7b; --line:#e3e8ee;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;
    background:var(--sand);color:var(--ink);line-height:1.6;min-height:100vh}
  a{color:inherit;text-decoration:none}

  .hero{color:#fff;padding:64px 24px 96px;background:linear-gradient(160deg,#08344f 0%,#0a6ea8 55%,#11a3c9 100%)}
  .hero-inner{max-width:960px;margin:0 auto}
  .eyebrow{letter-spacing:.2em;font-size:13px;font-weight:700;opacity:.85}
  .hero h1{font-size:clamp(36px,7vw,64px);line-height:1.05;font-weight:900;margin:10px 0 12px;letter-spacing:-.02em}
  .hero p{font-size:17px;opacity:.9;max-width:520px}

  main{max-width:960px;margin:-48px auto 0;padding:0 20px 80px}
  h2{font-size:14px;letter-spacing:.12em;color:var(--muted);font-weight:800;margin:32px 0 14px}
  h2:first-child{margin-top:0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .trip{display:block;background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(11,27,43,.08);
    transition:transform .2s,box-shadow .2s}
  .trip:hover{transform:translateY(-4px);box-shadow:0 16px 40px rgba(11,27,43,.14)}
  .cover{height:140px;display:flex;align-items:flex-end;padding:18px 22px;color:#fff;position:relative}
  .cover .flag{font-size:44px;line-height:1;position:absolute;right:18px;top:16px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.2))}
  .cover .city{font-size:28px;font-weight:900;letter-spacing:-.01em}
  .body{padding:18px 22px 22px}
  .when{font-size:14px;color:var(--muted);font-weight:700}
  .desc{margin-top:6px;font-size:15px}
  .meta{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .pill{font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px;background:#e6f4fb;color:var(--sea)}
  .pill.soon{background:var(--sun);color:#fff}
  .pill.past{background:var(--line);color:var(--muted)}
  .pill.plan{background:#fff1e6;color:#c25a12}

  .trip.planning{border:2px dashed #d5c9b6;background:transparent;box-shadow:none;cursor:default}
  .trip.planning:hover{transform:none;box-shadow:none}
  .trip.planning .cover{background:none;color:var(--ink);opacity:.7}
  .trip.planning .flag{filter:none;opacity:.8}

  footer{text-align:center;color:var(--muted);font-size:13px;padding:24px}
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="eyebrow">TRAVEL NOTES</div>
    <h1>여행 노트</h1>
    <p>다녀온 곳, 갈 곳. 여행마다 한 페이지씩 일정과 경비, 지도를 정리합니다.</p>
  </div>
</header>

<main>
  <h2 id="h-upcoming">다가오는 여행</h2>
  <div class="grid" id="upcoming"></div>
  <h2 id="h-past" hidden>다녀온 여행</h2>
  <div class="grid" id="past"></div>
</main>

<footer>Bon voyage 🌊</footer>

<script>
// 여행을 추가할 때는 폴더를 만들고 여기에 한 줄만 더하면 됩니다. 날짜는 YYYY-MM-DD.
const trips = [
  { city:"시드니", country:"호주", flag:"🇦🇺", href:"sydney/",
    start:"2026-10-22", end:"2026-10-26", nights:"4박 5일",
    desc:"본다이 바다 수영장과 조각 전시, 항구, 블루마운틴까지.",
    cover:"linear-gradient(160deg,#08344f,#0a6ea8 55%,#11a3c9)" },
  { city:"대만", country:"타이완", flag:"🇹🇼", planning:true,
    desc:"일정을 짜는 중이에요. 계획이 잡히면 페이지가 열립니다." }
];

const today = new Date(); today.setHours(0,0,0,0);
const fmt = d => { const [y,m,dd]=d.split("-").map(Number); return `${y}.${String(m).padStart(2,"0")}.${String(dd).padStart(2,"0")}`; };
const dayDiff = d => Math.round((new Date(d+"T00:00:00") - today)/86400000);

function card(t){
  if(t.planning){
    return `<div class="trip planning">
      <div class="cover"><span class="flag">${t.flag}</span><div class="city">${t.city}</div></div>
      <div class="body"><div class="when">${t.country} · 날짜 미정</div><div class="desc">${t.desc}</div>
      <div class="meta"><span class="pill plan">계획 중</span></div></div></div>`;
  }
  const left = dayDiff(t.start), over = dayDiff(t.end) < 0;
  let pill;
  if(over) pill = `<span class="pill past">다녀왔어요</span>`;
  else if(left <= 0) pill = `<span class="pill soon">여행 중!</span>`;
  else if(left <= 30) pill = `<span class="pill soon">D-${left}</span>`;
  else pill = `<span class="pill">D-${left}</span>`;
  return `<a class="trip" href="${t.href}">
    <div class="cover" style="background:${t.cover}"><span class="flag">${t.flag}</span><div class="city">${t.city}</div></div>
    <div class="body"><div class="when">${fmt(t.start)} – ${fmt(t.end)} · ${t.nights}</div><div class="desc">${t.desc}</div>
    <div class="meta">${pill}<span class="pill">${t.country}</span></div></div></a>`;
}

const up = trips.filter(t=>t.planning || dayDiff(t.end) >= 0).sort((a,b)=>(a.planning?1:0)-(b.planning?1:0) || a.start.localeCompare(b.start));
const past = trips.filter(t=>!t.planning && dayDiff(t.end) < 0).sort((a,b)=>b.start.localeCompare(a.start));
document.getElementById("upcoming").innerHTML = up.map(card).join("") || `<p style="color:var(--muted)">예정된 여행이 없어요.</p>`;
document.getElementById("past").innerHTML = past.map(card).join("");
document.getElementById("h-past").hidden = past.length === 0;
</script>
</body>
</html>
